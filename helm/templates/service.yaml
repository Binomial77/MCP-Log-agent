apiVersion: v1
kind: Service

metadata:
  name: agent-mcp-service
  labels:
    app: agent-mcp-server

spec:
  type: {{ .Values.service.type }}

  selector:
    app: agent-mcp-server

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}