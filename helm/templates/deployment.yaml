apiVersion: apps/v1
kind: Deployment

metadata:
  name: agent-mcp-server
  labels:
    app: agent-mcp-server

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: agent-mcp-server

  template:
    metadata:
      labels:
        app: agent-mcp-server

    spec:
      containers:
        - name: agent-mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP